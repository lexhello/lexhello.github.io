  <script>
    // Scrolling down on the homepage (wheel, swipe up, or Down/PageDown/Space)
    // takes you to the projects page.
    (function () {
      let leaving = false;
      const goToProjects = () => {
        if (leaving) return;
        leaving = true;
        window.location.href = "projects.html";
      };
      const atBottom = () =>
        window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;

      window.addEventListener("wheel", (e) => {
        if (e.deltaY > 20 && atBottom()) goToProjects();
      }, { passive: true });

      let touchStartY = null;
      window.addEventListener("touchstart", (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener("touchend", (e) => {
        if (touchStartY === null) return;
        const swipeUp = touchStartY - e.changedTouches[0].clientY;
        if (swipeUp > 60 && atBottom()) goToProjects();
        touchStartY = null;
      }, { passive: true });

      window.addEventListener("keydown", (e) => {
        if (["ArrowDown", "PageDown", " "].includes(e.key) && atBottom()) goToProjects();
      });
    })();
  </script>
